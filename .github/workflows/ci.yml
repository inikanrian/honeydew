name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep lint rules aligned with the validated development toolchain.
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            tools/content-build
      # libclang: bindgen in signalsmith-stretch's build script (Lemon Sampler's time stretching, C++).
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libclang-dev
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo check --workspace --target wasm32-unknown-unknown
      - name: Content tool
        run: cargo test --manifest-path tools/content-build/Cargo.toml

  native-multicore:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
      - uses: Swatinem/rust-cache@v2
      - name: libclang
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $llvm = 'C:\Program Files\LLVM\bin'
          if (-not (Test-Path "$llvm\libclang.dll")) { choco install llvm -y --no-progress }
          "LIBCLANG_PATH=$llvm" >> $env:GITHUB_ENV
      - run: cargo test --locked --lib parallel_racks_match_sequential_through_sends_and_live_toggle

  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.0.13004108'
          

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.91.0

      - name: Install Android Rust targets
        run: |
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev unzip

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Build Honeydew Android APK
        run: tools/android-dist.sh --base

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Honeydew-Android-APK
          path: target/honeydew-android-*-arm-base-debug.apk
          if-no-files-found: error
          retention-days: 7
          
